{% extends "retrobaser/base.html" %}
{% block title %}Forgot password{% endblock %}
{% block content %}
<div class="forms-container"><section class="forms-section">
  <h1>Reset Your Password</h1>
  <p>Enter your e-mail address and a temporary password will be sent to you.</p>
  <form method="post">{% csrf_token %}
    <label for="fp-email">E-mail:</label><input type="email" name="email" id="fp-email" required>
    <input type="submit" value="Reset My Password" class="SubmitEmail-Button">
  </form>
</section></div>
{% endblock %}
