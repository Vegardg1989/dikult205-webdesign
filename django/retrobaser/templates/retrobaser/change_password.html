{% extends "retrobaser/base.html" %}
{% block title %}Change password{% endblock %}
{% block content %}
<div class="forms-container"><section class="forms-section">
  <h1>Change Your Password</h1>
  <form method="post">{% csrf_token %}
    <label for="cp-pass">New Password:</label><input type="password" name="password" id="cp-pass" required>
    <label for="cp-repeat">Confirm New Password:</label><input type="password" name="password_repeat" id="cp-repeat" required>
    <input type="submit" value="Change My Password" class="SubmitNewPassword-Button">
  </form>
</section></div>
{% endblock %}
